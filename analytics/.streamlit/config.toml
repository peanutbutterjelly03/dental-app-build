# Pins the app chrome to the same light surface the chart palette was validated
# against. Run the dashboard from this folder so the theme is picked up.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"

[browser]
gatherUsageStats = false
