name: CI

# Runs the same "tsc both + build clean" check the sprint loop requires, so a
# pull request shows pass/fail before anyone merges it. This does not deploy —
# Vercel builds from main independently and is unaffected by this workflow.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dental-4-12-main/project

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dental-4-12-main/project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck app
        run: npx tsc -p tsconfig.json --noEmit

      - name: Typecheck server
        run: npx tsc -p tsconfig.server.json --noEmit

      - name: Build
        run: npm run build
